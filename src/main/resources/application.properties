spring.application.name=balance-service

# In-memory H2. LOCK_TIMEOUT bounds how long a transaction waits for a row lock (ms)
# before failing, so a stuck transaction can never hang callers forever.
spring.datasource.url=jdbc:h2:mem:balance;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20
# Isolation is set explicitly on each @Transactional; this is the connection default.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# Schema is owned by schema.sql (constraints are part of the design); Hibernate only validates it.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
